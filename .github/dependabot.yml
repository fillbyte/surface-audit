version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # MCP 2 removes the v1 FastMCP module used by the server. Keep receiving
      # v1 security and maintenance updates until the API migration is tested.
      - dependency-name: mcp
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Python 3.13+ adoption must update the declared support matrix and run
      # container smoke tests; continue accepting patches on the 3.12 line.
      - dependency-name: python
        versions:
          - ">= 3.13"
